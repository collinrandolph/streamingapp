# Builds the Android app (StreamingTracker.apk) and attaches it to the "android" release, which the app
# checks for updates. Every build is signed with your key, kept in two repository secrets:
#   ANDROID_KEYSTORE           the key file, base64 (tools/make-android-key.sh writes it)
#   ANDROID_KEYSTORE_PASSWORD  its password
# Without them, the app is still built to check it compiles, but nothing is published.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['server/**', 'web/**', 'android/**', 'tools/build-app.js', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Assemble the app's files
        run: |
          npm ci
          node tools/build-app.js
          npx cap sync android
      - name: Load the signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No signing key yet: building only to check it compiles. Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets to publish."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tracker.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/tracker.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ${{ steps.key.outputs.signed == 'true' && 'assembleRelease' || 'assembleDebug' }}
      - name: Publish to the android release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk StreamingTracker.apk
          NOTES="StreamingTracker.apk: the Android app, with the TV remote and Watch on TV built in (no PC needed; your phone and TV on the same Wi-Fi). Download it on your phone and open it; Android will ask you to allow installs from your browser once. Rebuilt automatically when the app changes; the app's Settings › App offers each new build."
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --title "Android app build $BUILD_NUMBER" --notes "$NOTES"
          fi
          gh release upload android StreamingTracker.apk --clobber
          gh release edit android --title "Android app build $BUILD_NUMBER" --notes "$NOTES"
